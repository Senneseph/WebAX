version: '3'

services:
  webax-dev:
    image: node:18-alpine
    container_name: webax-dev
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    command: >
      sh -c "if [ ! -d 'develop/node_modules' ]; then
              cd develop && npm install && cd ..;
            fi &&
            cd develop && npm run dev"
    environment:
      - NODE_ENV=development

  webax-build:
    image: node:18-alpine
    container_name: webax-build
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "cd develop && npm install && npm run build"
    environment:
      - NODE_ENV=production

  webax-docs:
    image: node:18-alpine
    container_name: webax-docs
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8081:8081"
    command: >
      sh -c "cd develop && npm install && npm run docs"
    environment:
      - NODE_ENV=development
